[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchproof"
version = "0.1.0"
description = "A repro-first Python debugging agent that verifies patch suggestions in temporary copies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
  "unidiff>=0.7.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
patchproof = "patchproof.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
